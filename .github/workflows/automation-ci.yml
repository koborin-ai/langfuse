name: Automation CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - ".github/**"
      - "deploy/**"
      - "infra/vm/**"
      - "**/*.md"
      - ".markdownlint.yaml"
      - ".tool-versions"
      - "mise.toml"

jobs:
  automation:
    name: Workflow, script, Compose and doc checks
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup toolchain
        uses: jdx/mise-action@v4

      - name: Lint workflows and scripts
        run: mise run check:automation

      - name: Validate Compose file
        run: mise run check:deploy

      - name: Lint Markdown docs
        run: mise run check:docs
