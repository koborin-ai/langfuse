name: Infrastructure Plan

# `pull_request`, never `pull_request_target`: fork PRs run without secrets or
# an OIDC token, and the job below skips them anyway. Plans authenticate as a
# read-only service account and print resource addresses, not diffs.

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - "infra/**"
      - ".tool-versions"
      - "mise.toml"
      - ".github/workflows/plan-infra.yml"
      - ".github/scripts/tf-plan-summary.sh"
  workflow_dispatch:

permissions: {}

concurrency:
  group: terraform-state
  cancel-in-progress: false

jobs:
  terraform-plan:
    if: >
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 30

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup toolchain
        uses: jdx/mise-action@v4

      - name: Analyze and test
        run: mise run check:infra

      - name: Synth
        working-directory: infra
        run: dart run bin/synth.dart

      - name: Authenticate to Google Cloud (read-only)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PLAN_SERVICE_ACCOUNT }}

      - name: Terraform Plan
        working-directory: infra/tf-out/langfuse
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TF_VAR_owner_email: ${{ secrets.LANGFUSE_OWNER_EMAIL }}
        run: |
          set -euo pipefail
          terraform init -input=false -no-color >/dev/null
          set +e
          bash "${GITHUB_WORKSPACE}/.github/scripts/tf-plan-summary.sh" tfplan -lock=false
          status=$?
          set -e
          rm -f tfplan
          [ "$status" -ne 1 ]
