name: Infrastructure Plan

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - "infra/**"
      - ".tool-versions"
      - "mise.toml"
      - ".github/workflows/plan-infra.yml"
  workflow_dispatch:

concurrency:
  group: terraform-state
  cancel-in-progress: false

jobs:
  terraform-plan:
    # Fork PRs get no OIDC token for this repository's WIF provider.
    if: >
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 30

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      LANGFUSE_OWNER_EMAIL: ${{ vars.LANGFUSE_OWNER_EMAIL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup toolchain
        uses: jdx/mise-action@v4

      - name: Analyze and test
        run: mise run check:infra

      - name: Synth
        working-directory: infra
        run: dart run bin/synth.dart

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Terraform Plan
        working-directory: infra/tf-out/langfuse
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          terraform init -input=false
          terraform plan -no-color -input=false | tee "${GITHUB_WORKSPACE}/terraform-plan.txt"

      - name: Post plan summary
        run: |
          {
            echo "## Terraform Plan (langfuse)"
            echo '```'
            tail -n 120 "${GITHUB_WORKSPACE}/terraform-plan.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
