name: Infrastructure Release

# Applies only from `main`: the job refuses other refs, the `production (infra)`
# environment should allow only `main`, and the GCP deployer service account
# only trusts OIDC tokens whose ref is refs/heads/main. Logs show resource
# addresses, never attribute values.

on:
  push:
    branches:
      - main
    paths:
      # Toolchain files are deliberately absent: a shellcheck bump should not
      # apply production infrastructure. plan-infra covers them on the PR.
      - "infra/**"
  workflow_dispatch:

permissions: {}

concurrency:
  group: terraform-state
  cancel-in-progress: false

jobs:
  terraform-apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 30
    environment: production (infra)

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_owner_email: ${{ secrets.LANGFUSE_OWNER_EMAIL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup toolchain
        uses: jdx/mise-action@v5

      - name: Analyze and test
        run: mise run check:infra

      - name: Synth Terraform config
        working-directory: infra
        run: dart run bin/synth.dart

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Derive R2 state credentials from the Cloudflare token
        run: bash .github/scripts/r2-state-credentials.sh

      - name: Terraform Init
        working-directory: infra/tf-out/langfuse
        run: terraform init -input=false -no-color >/dev/null

      - name: Terraform Plan
        id: plan
        working-directory: infra/tf-out/langfuse
        run: |
          set +e
          bash "${GITHUB_WORKSPACE}/.github/scripts/tf-plan-summary.sh" tfplan
          status=$?
          set -e
          [ "$status" -ne 1 ]
          echo "changes=$([ "$status" -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # Applying a saved plan prints progress per address, not the diff.
      - name: Terraform Apply
        if: steps.plan.outputs.changes == 'true'
        working-directory: infra/tf-out/langfuse
        run: terraform apply -input=false -no-color tfplan

      - name: Verify no drift
        working-directory: infra/tf-out/langfuse
        run: |
          rm -f tfplan
          set +e
          bash "${GITHUB_WORKSPACE}/.github/scripts/tf-plan-summary.sh" drift.tfplan
          status=$?
          set -e
          rm -f drift.tfplan
          if [ "$status" -eq 2 ]; then
            echo "Terraform state drift detected after apply"
          fi
          exit "$status"
