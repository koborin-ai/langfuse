# Langfuse on one VM, derived from upstream docker-compose.yml at v4.46.0:
# https://github.com/langfuse/langfuse/blob/v4.46.0/docker-compose.yml
#
# Differences from upstream (keep this list current when re-syncing):
#   1. No MinIO. Event, media, and batch-export blobs go to Cloudflare R2.
#   2. langfuse / langfuse-worker pinned to a patch release (Dependabot bumps).
#   3. cloudflared added; the tunnel's ingress is managed in Terraform.
#   4. No host ports. Only cloudflared reaches langfuse-web, over the
#      Compose network.
#   5. restart: unless-stopped, json-file log rotation, and bind mounts under
#      ${DATA_DIR} (the persistent data disk) instead of named volumes.
#   6. Secrets come from .env (rendered from Secret Manager by bin/up.sh);
#      required ones fail fast with ${VAR:?} instead of insecure defaults.
#   7. Healthchecks on langfuse-web / langfuse-worker so `up --wait` means
#      "serving", and unused optional settings (AI features, Azure/OCI blob,
#      in-app agent) dropped.

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  langfuse-worker:
    image: docker.io/langfuse/langfuse-worker:4.53.0
    restart: unless-stopped
    logging: *logging
    depends_on: &langfuse-depends-on
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment: &langfuse-worker-env
      HOSTNAME: 0.0.0.0
      NEXTAUTH_URL: ${NEXTAUTH_URL:?}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?}@postgres:5432/postgres
      SALT: ${SALT:?}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?}
      TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-false}
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: ${LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES:-false}
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: ${R2_BLOB_BUCKET:-langfuse-blob}
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: ${R2_ENDPOINT:?}
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: ${R2_BLOB_BUCKET:-langfuse-blob}
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: ${R2_ENDPOINT:?}
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      LANGFUSE_S3_BATCH_EXPORT_ENABLED: ${LANGFUSE_S3_BATCH_EXPORT_ENABLED:-true}
      LANGFUSE_S3_BATCH_EXPORT_BUCKET: ${R2_BLOB_BUCKET:-langfuse-blob}
      LANGFUSE_S3_BATCH_EXPORT_PREFIX: exports/
      LANGFUSE_S3_BATCH_EXPORT_REGION: auto
      LANGFUSE_S3_BATCH_EXPORT_ENDPOINT: ${R2_ENDPOINT:?}
      LANGFUSE_S3_BATCH_EXPORT_EXTERNAL_ENDPOINT: ${R2_ENDPOINT:?}
      LANGFUSE_S3_BATCH_EXPORT_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?}
      LANGFUSE_S3_BATCH_EXPORT_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?}
      LANGFUSE_S3_BATCH_EXPORT_FORCE_PATH_STYLE: "true"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${REDIS_AUTH:?}
      REDIS_TLS_ENABLED: "false"
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
      SMTP_CONNECTION_URL: ${SMTP_CONNECTION_URL:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3030/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s

  langfuse-web:
    image: docker.io/langfuse/langfuse:4.53.0
    restart: unless-stopped
    logging: *logging
    depends_on: *langfuse-depends-on
    environment:
      <<: *langfuse-worker-env
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?}
      # Sign-up is closed; the only user is the headless-init admin, who signs
      # in with email and password behind Cloudflare Access. Google OAuth is
      # optional and off until its client ID is set.
      AUTH_DISABLE_SIGNUP: ${AUTH_DISABLE_SIGNUP:-true}
      AUTH_DISABLE_USERNAME_PASSWORD: ${AUTH_DISABLE_USERNAME_PASSWORD:-false}
      AUTH_GOOGLE_CLIENT_ID: ${AUTH_GOOGLE_CLIENT_ID:-}
      AUTH_GOOGLE_CLIENT_SECRET: ${AUTH_GOOGLE_CLIENT_SECRET:-}
      AUTH_GOOGLE_ALLOW_ACCOUNT_LINKING: ${AUTH_GOOGLE_ALLOW_ACCOUNT_LINKING:-true}
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:-}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:-}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/public/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 180s

  cloudflared:
    image: docker.io/cloudflare/cloudflared:2026.9.3
    restart: unless-stopped
    logging: *logging
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?}
    depends_on:
      - langfuse-web

  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:25.12
    restart: unless-stopped
    logging: *logging
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?}
    volumes:
      - ${DATA_DIR:-/mnt/disks/data/langfuse}/clickhouse/data:/var/lib/clickhouse
      - ${DATA_DIR:-/mnt/disks/data/langfuse}/clickhouse/logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s

  redis:
    image: docker.io/redis:7
    restart: unless-stopped
    logging: *logging
    command: >
      --requirepass ${REDIS_AUTH:?}
      --maxmemory-policy noeviction
    volumes:
      - ${DATA_DIR:-/mnt/disks/data/langfuse}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10

  postgres:
    image: docker.io/postgres:17
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: postgres
      TZ: UTC
      PGTZ: UTC
    volumes:
      - ${DATA_DIR:-/mnt/disks/data/langfuse}/postgres:/var/lib/postgresql/data
